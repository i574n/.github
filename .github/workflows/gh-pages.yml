name: gh-pages
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    timeout-minutes: 420
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-2025]
    steps:
      - uses: actions/checkout@v6

      - uses: moonrepo/setup-rust@v1
        with:
          channel: "nightly-2025-05-09"
          components: "clippy,rust-src,rustfmt"
          targets: "wasm32-unknown-unknown"

      # Elixir and Gleam: the notebooks run through spiral/apps/kino (`mix spiral.notebook`, via its spi/run_notebook.ps1,
      # which also installs .NET 11 and builds the Spiral compiler into ~/.cache/spiral-bin when missing). Gleam >= 1.14:
      # kino's manifest.toml pins gleam_stdlib 1.0.5. jupyter (html outputs) comes from polyglot's requirements.txt.
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "27"
          elixir-version: "1.18"
          gleam-version: "1.14.0"
          rebar3-version: "3.24.0"

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "9.0.202"

      - uses: actions/setup-node@v6
        with:
          node-version: 21

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12.10"

      - run: pwsh scripts/workflow.ps1

      - uses: actions/upload-artifact@v5
        if: contains(matrix.os, 'ubuntu')
        with:
          name: gh-pages
          path: dist
          retention-days: 30

  push:
    needs: build
    timeout-minutes: 180
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v6
        with:
          name: gh-pages
          path: gh-pages

      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: gh-pages
